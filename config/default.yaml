messaging:
  # Polling interval in seconds
  pollInterval: 30
  # Channels to monitor (empty = all channels the user is in)
  channels: []

classifier:
  # Any OpenAI-compatible endpoint
  provider:
    baseUrl: ${WORKSTREAM_LLM_BASE_URL:-https://api.anthropic.com/v1}
    model: ${WORKSTREAM_LLM_MODEL:-claude-sonnet-4-6}
    apiKey: ${WORKSTREAM_LLM_API_KEY:-}
  # Confidence threshold — below this, classify as "noise"
  confidenceThreshold: 0.6
  # "llm": the LLM above classifies everything (default).
  # "decisions": a decision model decides status and whether the operator should see each message;
  #   the LLM still writes titles, next actions and work item links. Both run in parallel per message.
  mode: llm
  # decisions:
  #   provider: openai            # openai (OpenAI Decisions API) | typesafe (Jev; uses OpenRouter if no key) | llm
  #   apiKey: ${OPENAI_API_KEY:-}
  #   interruptThreshold: 0.5     # surface when P(blocked)+P(decision) reaches this; lower = fewer misses, more interrupts

taskAdapter:
  # baseUrl loaded from WORKSTREAM_JIRA_BASE_URL env var
  # token loaded from WORKSTREAM_JIRA_TOKEN env var
  enabled: false
  ticketPrefixes:
    - "OPS-"
    - "ENG-"
    - "MKT-"

extractors:
  # Regex patterns for work item ID extraction
  ticketPatterns:
    - "\\b([A-Z]{2,6}-\\d+)\\b"
  prPatterns:
    - "PR\\s*#?(\\d+)"
    - "#(\\d+)"

rateLimits:
  llm:
    maxPerMinute: 4          # Conservative for Anthropic (free tier = 5/min)
  # Slack rate limiting is handled internally by the adapter (per-method tiers)
  jira:
    maxPerMinute: 30         # Jira Cloud is generous

lookback:
  # How far back to look on first load (before any poll cursors exist)
  initialDays: 1             # 1 day — keeps initial LLM calls manageable
  # Max threads to classify per poll cycle (0 = unlimited)
  maxThreadsPerPoll: 50

continuation:
  # Strategy for grouping non-threaded messages into conversations
  strategy: "classifier-inline"   # enriches classifier prompt with channel context
  channelContextWindow: 30        # minutes to look back for recent messages
  maxContextMessages: 5           # max messages to include as channel context

mcp:
  # Transport: "stdio" for local agents
  transport: stdio

server:
  port: 9847
  host: "127.0.0.1"

quickReplies:
  blocked_on_human:
    - "Approved, proceed"
    - "Hold — waiting for my review"
    - "Re-do with the following constraint:"
  needs_decision:
    - "Go with option A"
    - "Go with option B"
    - "Need more info before deciding"

anomalies:
  staleThresholdHours: 4
  silentAgentThresholdHours: 2

sidekick:
  enabled: true
  maxToolCalls: 5
  maxHistoryTurns: 10

operator:
  name: ""
  role: ""
  context: ""

llmBudget:
  dailyBudget: null              # USD per day, null = unlimited
  inputCostPerMillion: null      # USD per 1M input tokens
  outputCostPerMillion: null     # USD per 1M output tokens
